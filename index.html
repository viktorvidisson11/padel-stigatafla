<title>Padel Stigatafla</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7f1;
    --surface: #ffffff;
    --surface-alt: #eef2ea;
    --ink: #16241d;
    --muted: #5c6b60;
    --line: #dbe3d5;
    --accent: #c3dd00;
    --accent-ink: #23300a;
    --team-a: #2f6fed;
    --team-a-soft: #e8eefd;
    --team-b: #ef5b3b;
    --team-b-soft: #fdece7;
    --live-ok: #2f9d6c;
    --live-off: #b58a2b;
    --shadow: 0 1px 2px rgba(22,36,29,0.06), 0 8px 24px -12px rgba(22,36,29,0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b120e;
      --surface: #121b16;
      --surface-alt: #182219;
      --ink: #edf3ea;
      --muted: #8fa196;
      --line: #253128;
      --accent: #c3dd00;
      --accent-ink: #17210a;
      --team-a: #6f9bff;
      --team-a-soft: #172035;
      --team-b: #ff8a68;
      --team-b-soft: #2c1a14;
      --live-ok: #4fd18f;
      --live-off: #d1a94f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b120e;
    --surface: #121b16;
    --surface-alt: #182219;
    --ink: #edf3ea;
    --muted: #8fa196;
    --line: #253128;
    --accent: #c3dd00;
    --accent-ink: #17210a;
    --team-a: #6f9bff;
    --team-a-soft: #172035;
    --team-b: #ff8a68;
    --team-b-soft: #2c1a14;
    --live-ok: #4fd18f;
    --live-off: #d1a94f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .display {
    font-family: "Oswald", "Work Sans", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 14px calc(24px + env(safe-area-inset-bottom));
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: calc(14px + env(safe-area-inset-top)) 14px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--line);
  }

  .topbar h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 700;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live-off);
    flex-shrink: 0;
  }

  .status.live .dot {
    background: var(--live-ok);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .status.live .dot { animation: none; }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79,209,143,0.5); }
    50% { box-shadow: 0 0 0 5px rgba(79,209,143,0); }
  }

  section {
    margin-top: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
  }

  h2.label {
    margin: 0 0 10px;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  .setup-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }

  .setup-row:last-of-type { border-bottom: none; }

  .setup-label {
    font-size: 0.92rem;
    font-weight: 600;
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stepper-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface-alt);
    color: var(--ink);
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }

  .stepper-value {
    font-family: "Oswald", sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    min-width: 20px;
    text-align: center;
  }

  .rc-input {
    width: 64px;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-alt);
    color: var(--ink);
    font-size: 0.95rem;
    font-family: inherit;
    text-align: center;
  }

  .apply-btn {
    width: 100%;
    margin-top: 12px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
  }

  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
  }

  .players-grid input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-alt);
    color: var(--ink);
    font-size: 0.92rem;
    font-family: inherit;
    min-height: 40px;
  }

  .players-grid input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .players-grid input::placeholder {
    color: var(--muted);
    opacity: 1;
  }

  .leaderboard {
    display: flex;
    flex-direction: column;
  }

  .lb-row {
    display: grid;
    grid-template-columns: auto 1fr auto 60px;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }

  .lb-row:last-child { border-bottom: none; }

  .lb-rank {
    font-family: "Oswald", sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
    min-width: 22px;
  }

  .lb-row.first .lb-rank {
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 999px;
    padding: 2px 8px;
    display: inline-block;
  }

  .lb-name {
    font-weight: 600;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lb-record {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 0.82rem;
  }

  .lb-bar-track {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-alt);
    overflow: hidden;
  }

  .lb-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
  }

  .next-card {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-alt) 100%);
    border: 1.5px solid var(--accent);
  }

  .next-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .next-header .label {
    margin: 0;
  }

  .next-round-num {
    font-family: "Oswald", sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .rest-line {
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .rest-line strong { color: var(--ink); }

  .teams {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .team-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    min-height: 52px;
    text-align: left;
  }

  .team-btn.a { border-color: var(--team-a); }
  .team-btn.b { border-color: var(--team-b); }

  .team-btn.a.selected {
    background: var(--team-a);
    border-color: var(--team-a);
    color: #fff;
  }

  .team-btn.b.selected {
    background: var(--team-b);
    border-color: var(--team-b);
    color: #fff;
  }

  .team-btn .check {
    opacity: 0;
    font-size: 1.1rem;
  }

  .team-btn.selected .check {
    opacity: 1;
  }

  .finished-banner {
    text-align: center;
    padding: 14px;
  }

  .finished-banner .headline {
    font-family: "Oswald", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.95rem;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 10px 14px;
    border-radius: 10px;
    display: inline-block;
  }

  .finished-banner .resume-link {
    display: block;
    margin-top: 10px;
    font-size: 0.82rem;
    color: var(--muted);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
  }

  .schedule-list .round {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }

  .schedule-list .round:last-child { border-bottom: none; }

  .round-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Oswald", sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    flex-shrink: 0;
    color: var(--muted);
  }

  .round-body {
    flex: 1;
    min-width: 0;
  }

  .round-teams-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .round-team-btn {
    flex: 1;
    min-width: 0;
    padding: 7px 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-alt);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-height: 34px;
  }

  .round-team-btn.a.selected { background: var(--team-a-soft); color: var(--team-a); border-color: var(--team-a); }
  .round-team-btn.b.selected { background: var(--team-b-soft); color: var(--team-b); border-color: var(--team-b); }

  .round-teams-row .vs {
    color: var(--muted);
    font-size: 0.72rem;
    flex-shrink: 0;
  }

  .round-rest {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .btn {
    flex: 1;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
  }

  .btn.danger {
    color: #c24b3a;
    border-color: rgba(194,75,58,0.35);
  }

  .btn.confirm-armed {
    background: #c24b3a;
    border-color: #c24b3a;
    color: #fff;
  }

  .btn.reshuffle {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }

  .add-games {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  .add-games .rc-input {
    width: 52px;
    flex-shrink: 0;
  }

  .add-games button {
    flex: 1;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.72rem;
    margin-top: 18px;
  }

  .error-banner {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 20;
    background: #c24b3a;
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.8rem;
    box-shadow: var(--shadow);
    display: none;
  }

  .error-banner.show { display: block; }
</style>

<div class="wrap">
  <div class="topbar">
    <h1 class="display">Padel</h1>
    <div class="status live" id="status">
      <span class="dot"></span>
      <span id="status-text">Vistað</span>
    </div>
  </div>

  <section class="card" id="setup-card">
    <h2 class="label">Uppsetning</h2>
    <div class="setup-row">
      <span class="setup-label">Leikmenn</span>
      <div class="stepper">
        <button class="stepper-btn" id="pc-minus" aria-label="Fækka leikmönnum" type="button">−</button>
        <span class="stepper-value" id="pc-value">5</span>
        <button class="stepper-btn" id="pc-plus" aria-label="Fjölga leikmönnum" type="button">+</button>
      </div>
    </div>
    <div class="setup-row">
      <span class="setup-label">Fjöldi leikja</span>
      <input type="number" id="rc-input" class="rc-input" min="1" max="99" value="15" inputmode="numeric">
    </div>
    <button class="apply-btn" id="apply-setup-btn" type="button">Búa til leikjaplan</button>
  </section>

  <section class="card" id="players-card">
    <h2 class="label">Leikmenn</h2>
    <div class="players-grid" id="players-grid"></div>
  </section>

  <section id="next-section"></section>

  <section class="card" id="standings-card">
    <h2 class="label">Staðan</h2>
    <div class="leaderboard" id="leaderboard"></div>
  </section>

  <section class="card">
    <h2 class="label">Allt planið</h2>
    <div class="schedule-list" id="schedule-list"></div>
  </section>

  <div class="toolbar">
    <button class="btn reshuffle" id="reshuffle-btn" type="button">Endurraða</button>
    <button class="btn danger" id="reset-btn" type="button">Núllstilla úrslit</button>
  </div>
  <div class="toolbar">
    <div class="add-games">
      <input type="number" id="add-count" class="rc-input" min="1" max="50" value="5" inputmode="numeric" aria-label="Fjöldi leikja sem á að bæta við">
      <button class="btn" id="add-games-btn" type="button">Bæta við leikjum</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn" id="finish-btn" type="button">Ljúka leik núna</button>
  </div>

  <footer id="footer-note">Vistast sjálfkrafa í þessum vafra á þessu tæki.</footer>
</div>

<div class="error-banner" id="error-banner"></div>

<script>
  // ---- Schedule generation --------------------------------------------
  // General-purpose greedy scheduler for any player count >= 4. Each round
  // is 2v2 (4 active players); the rest sit that round out. The greedy
  // rule: rest whoever has rested least so far (and, whenever possible,
  // didn't rest in the immediately preceding round, so nobody sits out
  // twice in a row), then split the 4 active players into the 2v2 pairing
  // that has partnered least so far. Because rounds can be appended at any
  // time (not just generated once up front), this has to work
  // incrementally rather than as a single precomputed design.

  function pairKey(a, b) {
    return a < b ? a + '-' + b : b + '-' + a;
  }

  // Extends `existingSchedule` (an array of {round, rest, teamA, teamB})
  // by `extraCount` more rounds for `playerCount` players, replaying the
  // existing rounds first to rebuild the running rest/partner counts.
  // Returns the full (existing + new) schedule; never mutates the input.
  function appendRounds(playerCount, existingSchedule, extraCount) {
    const players = Array.from({ length: playerCount }, (_, i) => i);
    const restCount = Array(playerCount).fill(0);
    const partnerCount = {};
    players.forEach((p) => players.forEach((q) => {
      if (q > p) partnerCount[pairKey(p, q)] = 0;
    }));
    let lastRest = new Set();

    existingSchedule.forEach((r) => {
      r.rest.forEach((p) => { restCount[p] += 1; });
      partnerCount[pairKey(r.teamA[0], r.teamA[1])] += 1;
      partnerCount[pairKey(r.teamB[0], r.teamB[1])] += 1;
      lastRest = new Set(r.rest);
    });

    const restersNeeded = Math.max(0, playerCount - 4);
    const newRounds = [];

    for (let n = 0; n < extraCount; n++) {
      let resters = [];
      if (restersNeeded > 0) {
        const eligible = players.filter((p) => !lastRest.has(p));
        const fallback = players.filter((p) => lastRest.has(p));
        const byLeastRested = (a, b) => restCount[a] - restCount[b] || Math.random() - 0.5;
        eligible.sort(byLeastRested);
        fallback.sort(byLeastRested);
        resters = eligible.length >= restersNeeded
          ? eligible.slice(0, restersNeeded)
          : eligible.concat(fallback.slice(0, restersNeeded - eligible.length));
      }
      const restersSet = new Set(resters);
      const active = players.filter((p) => !restersSet.has(p));

      const [p0, p1, p2, p3] = active;
      const splits = [
        { teamA: [p0, p1], teamB: [p2, p3] },
        { teamA: [p0, p2], teamB: [p1, p3] },
        { teamA: [p0, p3], teamB: [p1, p2] },
      ];
      let best = splits[0];
      let bestScore = Infinity;
      splits.forEach((s) => {
        const score = partnerCount[pairKey(s.teamA[0], s.teamA[1])]
          + partnerCount[pairKey(s.teamB[0], s.teamB[1])]
          + Math.random() * 0.01;
        if (score < bestScore) {
          bestScore = score;
          best = s;
        }
      });

      newRounds.push({
        round: existingSchedule.length + newRounds.length + 1,
        rest: resters,
        teamA: best.teamA,
        teamB: best.teamB,
      });

      resters.forEach((p) => { restCount[p] += 1; });
      partnerCount[pairKey(best.teamA[0], best.teamA[1])] += 1;
      partnerCount[pairKey(best.teamB[0], best.teamB[1])] += 1;
      lastRest = restersSet;
    }

    return existingSchedule.concat(newRounds);
  }

  function generateSchedule(playerCount, roundCount) {
    return appendRounds(playerCount, [], roundCount);
  }

  // ---- State -------------------------------------------------------------

  const LOCAL_KEY = 'padel-live-state';
  const MIN_PLAYERS = 4;
  const MAX_PLAYERS = 12;

  function defaultState() {
    const playerCount = 5;
    const roundCount = 15;
    return {
      playerCount,
      players: Array(playerCount).fill(''),
      schedule: generateSchedule(playerCount, roundCount),
      results: Array(roundCount).fill(null),
      finished: false,
    };
  }

  function isValidState(raw) {
    return !!raw && typeof raw === 'object'
      && Number.isInteger(raw.playerCount) && raw.playerCount >= MIN_PLAYERS
      && Array.isArray(raw.players) && raw.players.length === raw.playerCount
      && Array.isArray(raw.schedule)
      && Array.isArray(raw.results) && raw.results.length === raw.schedule.length;
  }

  function sanitize(raw) {
    if (!isValidState(raw)) return defaultState();
    const players = raw.players.map((p, i) => {
      if (typeof p !== 'string') return '';
      return p === `Leikmaður ${i + 1}` ? '' : p;
    });
    return {
      playerCount: raw.playerCount,
      players,
      schedule: raw.schedule,
      results: raw.results,
      finished: !!raw.finished,
    };
  }

  let state = defaultState();

  function loadLocal() {
    try {
      const raw = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
      if (raw) state = sanitize(raw);
    } catch (e) {}
  }

  function persist() {
    let ok = true;
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
    } catch (e) {
      ok = false;
    }
    setStatus(ok ? 'Vistað' : 'Ekki tókst að vista', ok);
  }

  function setStatus(text, ok) {
    const el = document.getElementById('status');
    const label = document.getElementById('status-text');
    label.textContent = text;
    el.classList.toggle('live', !!ok);
  }

  function showError(msg) {
    const el = document.getElementById('error-banner');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showError._t);
    showError._t = setTimeout(() => el.classList.remove('show'), 6000);
  }

  window.addEventListener('error', (e) => showError('Villa: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => showError('Villa: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

  function playerName(idx) {
    const raw = state.players[idx];
    return raw && raw.trim() ? raw.trim() : `Leikmaður ${idx + 1}`;
  }

  function restLabel(restArr) {
    if (!restArr.length) return '';
    return restArr.map(playerName).join(', ');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function hasResults() {
    return state.results.some((r) => r !== null);
  }

  // ---- Rendering -----------------------------------------------------

  function renderPlayers() {
    const grid = document.getElementById('players-grid');
    if (document.activeElement && document.activeElement.closest && document.activeElement.closest('#players-grid')) return;
    grid.innerHTML = '';
    for (let idx = 0; idx < state.playerCount; idx++) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = state.players[idx] || '';
      input.placeholder = `Leikmaður ${idx + 1}`;
      input.maxLength = 24;
      input.setAttribute('aria-label', `Nafn leikmanns ${idx + 1}`);
      input.addEventListener('input', (e) => {
        state.players[idx] = e.target.value;
        renderNext();
        renderStandings();
        renderSchedule();
        clearTimeout(input._debounce);
        input._debounce = setTimeout(persist, 200);
      });
      input.addEventListener('blur', (e) => {
        state.players[idx] = e.target.value.trim();
        persist();
      });
      grid.appendChild(input);
    }
  }

  function computeStandings() {
    const played = Array(state.playerCount).fill(0);
    const wins = Array(state.playerCount).fill(0);
    state.schedule.forEach((r, i) => {
      const result = state.results[i];
      for (let p = 0; p < state.playerCount; p++) {
        if (!r.rest.includes(p)) played[p] += 1;
      }
      if (result === 'A') r.teamA.forEach((p) => { wins[p] += 1; });
      else if (result === 'B') r.teamB.forEach((p) => { wins[p] += 1; });
    });
    return Array.from({ length: state.playerCount }, (_, idx) => ({
      idx, name: playerName(idx), played: played[idx], wins: wins[idx],
    }));
  }

  // Standard competition ranking: players tied on wins share one rank
  // label (e.g. "2.-3."), and the rank after a tie skips ahead to match.
  function rankLabels(sorted) {
    const labels = [];
    let i = 0;
    while (i < sorted.length) {
      let j = i;
      while (j + 1 < sorted.length && sorted[j + 1].wins === sorted[i].wins) j += 1;
      const label = i === j ? `${i + 1}.` : `${i + 1}.-${j + 1}.`;
      for (let k = i; k <= j; k++) labels.push(label);
      i = j + 1;
    }
    return labels;
  }

  function renderStandings() {
    const box = document.getElementById('leaderboard');
    const rows = computeStandings();
    const maxWins = Math.max(1, ...rows.map((r) => r.wins));
    const sorted = [...rows].sort((a, b) => b.wins - a.wins || a.name.localeCompare(b.name));
    const labels = rankLabels(sorted);
    box.innerHTML = sorted.map((row, idx) => `
      <div class="lb-row ${labels[idx] === labels[0] && row.wins > 0 ? 'first' : ''}">
        <div class="lb-rank">${labels[idx]}</div>
        <div class="lb-name">${escapeHtml(row.name)}</div>
        <div class="lb-bar-track" style="width:56px"><div class="lb-bar-fill" style="width:${(row.wins / maxWins) * 100}%"></div></div>
        <div class="lb-record">${row.wins}&nbsp;/&nbsp;${row.played}</div>
      </div>
    `).join('');
  }

  function teamLabel(indices) {
    return indices.map((i) => playerName(i)).join(' & ');
  }

  function setWinner(roundIdx, winner) {
    state.results[roundIdx] = state.results[roundIdx] === winner ? null : winner;
    renderAll();
    persist();
  }

  function renderNext() {
    const section = document.getElementById('next-section');
    const nextIdx = state.results.findIndex((r) => r === null);
    const allPlayed = nextIdx === -1;

    if (state.finished || allPlayed) {
      const headline = state.finished && !allPlayed ? 'Leiknum lokað' : 'Allir leikir spilaðir 🏆';
      const resumeLink = state.finished && !allPlayed
        ? `<button class="resume-link" id="resume-link">Halda áfram að spila</button>`
        : '';
      section.innerHTML = `
        <div class="card finished-banner">
          <span class="headline">${headline}</span>
          ${resumeLink}
        </div>
      `;
      const resumeBtn = document.getElementById('resume-link');
      if (resumeBtn) {
        resumeBtn.addEventListener('click', () => {
          state.finished = false;
          renderAll();
          persist();
        });
      }
      return;
    }

    const r = state.schedule[nextIdx];
    const restHtml = r.rest.length
      ? `<p class="rest-line">Hvílir: <strong>${escapeHtml(restLabel(r.rest))}</strong></p>`
      : '';
    section.innerHTML = `
      <div class="card next-card">
        <div class="next-header">
          <h2 class="label">Næsti leikur</h2>
          <span class="next-round-num">Leikur ${r.round} / ${state.schedule.length}</span>
        </div>
        ${restHtml}
        <div class="teams">
          <button class="team-btn a ${state.results[nextIdx] === 'A' ? 'selected' : ''}" data-round="${nextIdx}" data-winner="A" type="button">
            <span>${escapeHtml(teamLabel(r.teamA))}</span><span class="check">✓</span>
          </button>
          <button class="team-btn b ${state.results[nextIdx] === 'B' ? 'selected' : ''}" data-round="${nextIdx}" data-winner="B" type="button">
            <span>${escapeHtml(teamLabel(r.teamB))}</span><span class="check">✓</span>
          </button>
        </div>
      </div>
    `;
    section.querySelectorAll('.team-btn').forEach((btn) => {
      btn.addEventListener('click', () => setWinner(Number(btn.dataset.round), btn.dataset.winner));
    });
  }

  // Every round is tappable here, not just the "next up" one, so a
  // misclick can always be corrected: tap the other team to switch the
  // winner, or tap the highlighted team again to clear it.
  function renderSchedule() {
    const list = document.getElementById('schedule-list');
    list.innerHTML = state.schedule.map((r, i) => {
      const result = state.results[i];
      const restHtml = r.rest.length
        ? `<div class="round-rest">Hvílir: ${escapeHtml(restLabel(r.rest))}</div>`
        : '';
      return `
        <div class="round">
          <div class="round-num">${r.round}</div>
          <div class="round-body">
            <div class="round-teams-row">
              <button class="round-team-btn a ${result === 'A' ? 'selected' : ''}" data-round="${i}" data-winner="A" type="button">${escapeHtml(teamLabel(r.teamA))}</button>
              <span class="vs">vs</span>
              <button class="round-team-btn b ${result === 'B' ? 'selected' : ''}" data-round="${i}" data-winner="B" type="button">${escapeHtml(teamLabel(r.teamB))}</button>
            </div>
            ${restHtml}
          </div>
        </div>
      `;
    }).join('');
    list.querySelectorAll('.round-team-btn').forEach((btn) => {
      btn.addEventListener('click', () => setWinner(Number(btn.dataset.round), btn.dataset.winner));
    });
  }

  function renderFinishButton() {
    const btn = document.getElementById('finish-btn');
    btn.textContent = state.finished ? 'Halda áfram að spila' : 'Ljúka leik núna';
    btn.classList.toggle('reshuffle', state.finished);
  }

  function renderAll() {
    renderPlayers();
    renderNext();
    renderStandings();
    renderSchedule();
    renderFinishButton();
  }

  // ---- Setup card (player/round count) --------------------------------

  let draftPlayerCount = state.playerCount;

  function renderSetup() {
    draftPlayerCount = state.playerCount;
    document.getElementById('pc-value').textContent = draftPlayerCount;
    document.getElementById('rc-input').value = state.schedule.length;
  }

  document.getElementById('pc-minus').addEventListener('click', () => {
    draftPlayerCount = Math.max(MIN_PLAYERS, draftPlayerCount - 1);
    document.getElementById('pc-value').textContent = draftPlayerCount;
  });
  document.getElementById('pc-plus').addEventListener('click', () => {
    draftPlayerCount = Math.min(MAX_PLAYERS, draftPlayerCount + 1);
    document.getElementById('pc-value').textContent = draftPlayerCount;
  });

  function doApplySetup() {
    const rcInput = document.getElementById('rc-input');
    const roundCount = Math.max(1, Math.min(99, parseInt(rcInput.value, 10) || 15));
    const oldPlayers = state.players;
    state.playerCount = draftPlayerCount;
    state.players = Array.from({ length: draftPlayerCount }, (_, i) => oldPlayers[i] || '');
    state.schedule = generateSchedule(draftPlayerCount, roundCount);
    state.results = Array(roundCount).fill(null);
    state.finished = false;
    renderAll();
    renderSetup();
    persist();
  }

  // ---- Buttons: confirm-armed destructive actions ----------------------

  // Artifact pages run sandboxed and browsers commonly block window.confirm()
  // there (it silently returns false, no dialog ever shows) — so
  // destructive buttons confirm inline instead: tap once to arm, tap again
  // within a few seconds to actually do it. If there's nothing to lose
  // (no results recorded yet), skip the confirmation entirely.
  function armWithConfirm(btn, confirmLabel, action, shouldConfirm) {
    const original = btn.textContent;
    let armed = false;
    let timer = null;
    function disarm() {
      armed = false;
      clearTimeout(timer);
      btn.textContent = original;
      btn.classList.remove('confirm-armed');
    }
    btn.addEventListener('click', () => {
      if (!shouldConfirm()) {
        action();
        return;
      }
      if (!armed) {
        armed = true;
        btn.textContent = confirmLabel;
        btn.classList.add('confirm-armed');
        timer = setTimeout(disarm, 3000);
        return;
      }
      disarm();
      action();
    });
  }

  armWithConfirm(document.getElementById('apply-setup-btn'), 'Ertu viss? Eyðir úrslitum', doApplySetup, hasResults);

  armWithConfirm(document.getElementById('reshuffle-btn'), 'Ertu viss? Smelltu aftur', () => {
    state.schedule = generateSchedule(state.playerCount, state.schedule.length);
    state.results = Array(state.schedule.length).fill(null);
    state.finished = false;
    renderAll();
    persist();
  }, hasResults);

  armWithConfirm(document.getElementById('reset-btn'), 'Ertu viss? Smelltu aftur', () => {
    state.results = Array(state.schedule.length).fill(null);
    state.finished = false;
    renderAll();
    persist();
  }, hasResults);

  document.getElementById('add-games-btn').addEventListener('click', () => {
    const input = document.getElementById('add-count');
    const extra = Math.max(1, Math.min(50, parseInt(input.value, 10) || 5));
    state.schedule = appendRounds(state.playerCount, state.schedule, extra);
    state.results = state.results.concat(Array(extra).fill(null));
    state.finished = false;
    renderAll();
    renderSetup();
    persist();
  });

  document.getElementById('finish-btn').addEventListener('click', () => {
    state.finished = !state.finished;
    renderAll();
    persist();
  });

  loadLocal();
  renderSetup();
  renderAll();
</script>
